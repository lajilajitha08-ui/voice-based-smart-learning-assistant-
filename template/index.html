<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Voice-Based Smart Learning Assistant</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            background: #f4f7fb;
            color: #222;
            text-align: center;
        }

        header {
            background: #4f46e5;
            color: white;
            padding: 25px;
        }

        .container {
            max-width: 700px;
            margin: 50px auto;
            padding: 30px;
            background: white;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        button {
            padding: 15px 25px;
            border: none;
            border-radius: 25px;
            background: #4f46e5;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #3730a3;
        }

        #question, #answer {
            margin: 20px 0;
            padding: 15px;
            background: #f1f5f9;
            border-radius: 10px;
            min-height: 30px;
        }

        footer {
            margin-top: 50px;
            padding: 15px;
            background: #222;
            color: white;
        }
    </style>
</head>

<body>

    <header>
        <h1>🎓 Voice-Based Smart Learning Assistant</h1>
        <p>Learn smarter with voice interaction</p>
    </header>

    <div class="container">
        <h2>Welcome, Student!</h2>

        <p>Click the button and ask your question.</p>

        <button onclick="startListening()">🎤 Start Speaking</button>

        <div id="question">
            Your question will appear here...
        </div>

        <div id="answer">
            Assistant response will appear here...
        </div>
    </div>

    <footer>
        <p>© 2026 Voice-Based Smart Learning Assistant</p>
    </footer>

    <script>
        function startListening() {
            const SpeechRecognition =
                window.SpeechRecognition || window.webkitSpeechRecognition;

            if (!SpeechRecognition) {
                alert("Speech recognition is not supported in this browser.");
                return;
            }

            const recognition = new SpeechRecognition();

            recognition.lang = "en-US";
            recognition.start();

            recognition.onresult = function(event) {
                const question = event.results[0][0].transcript;

                document.getElementById("question").innerHTML =
                    "<b>You:</b> " + question;

                let answer = "I heard your question: " + question +
                             ". Your learning assistant is ready to help!";

                document.getElementById("answer").innerHTML =
                    "<b>Assistant:</b> " + answer;

                speak(answer);
            };

            recognition.onerror = function() {
                document.getElementById("answer").innerHTML =
                    "Sorry, I couldn't understand your voice. Please try again.";
            };
        }

        function speak(text) {
            const speech = new SpeechSynthesisUtterance(text);
            speech.lang = "en-US";
            window.speechSynthesis.speak(speech);
        }
    </script>

</body>
</html>
